# /opt/fleet/agents/fleet-controller/config.yaml
_config_version: 12
model:
  default: "kimi-k3"
  provider: "custom"
  base_url: "https://api.venice.ai/api/v1"
  api_key: "${VENICE_API_KEY}"

gateway:
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    allowed_users: "${TELEGRAM_ALLOWED_USERS}"

platforms:
  telegram:
    allowed_chats: ["${TELEGRAM_ALLOWED_USERS}"]

quick_commands:
  pair:
    type: exec
    command: python3 /opt/fleet/bin/fleet-pair.py --tg
  login:
    type: exec
    command: python3 /opt/fleet/bin/fleet-pair.py --tg
  report:
    type: exec
    command: python3 /opt/fleet/bin/fleet-report.py --stdout
  status:
    type: exec
    command: python3 /opt/fleet/bin/fleet-scan.py --status
  fleet:
    type: exec
    command: python3 /opt/fleet/bin/fleet-scan.py --status
  privacy:
    type: exec
    command: python3 /opt/fleet/bin/venice-resolve-model.py privacy-summary
  backup:
    type: exec
    command: /opt/fleet/bin/fleet-backup.sh
  pull:
    type: exec
    command: /opt/fleet/bin/fleet-pull.sh

skills:
  external_dirs:
    - /opt/fleet/skills
